name: auto-port

# Automatically ports new commits from affaan-m/ECC
# into this OpenCode V2 mirror. Triggered by:
#   - schedule (every 6 hours)
#   - manual workflow dispatch
#   - repository_dispatch (immediate, from source repo webhook)
#
# Pushes directly to main — no manual PR review needed.
# Requires secret: AUTO_PORT_TOKEN (Personal Access Token with repo scope)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-port even if no new commits"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [auto-port]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      new_commits: ${{ steps.detect.outputs.commits }}
      head_sha: ${{ steps.detect.outputs.head }}
    steps:
      - name: Check for new commits in source repo
        id: detect
        run: |
          HEAD=$(curl -s "https://api.github.com/repos/affaan-m/ECC" | jq -r '.pushed_at')
          LAST=$(cat .opencode/last-port-sha 2>/dev/null || echo "")
          if [ "$HEAD" != "$LAST" ]; then
            echo "commits=true" >> $GITHUB_OUTPUT
            echo "head=$HEAD" >> $GITHUB_OUTPUT
            echo "New commits detected (source pushed_at: $HEAD)"
          else
            echo "commits=false" >> $GITHUB_OUTPUT
            echo "head=$HEAD" >> $GITHUB_OUTPUT
            echo "No new commits — skipping port"
          fi

  port:
    needs: detect
    if: needs.detect.outputs.new_commits == 'true' || inputs.force == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_PORT_TOKEN }}

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: affaan-m/ECC
          path: source
          token: ${{ secrets.AUTO_PORT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run port script
        run: node .opencode/scripts/port.js source . --force=${{ inputs.force }}

      - name: Update last-port tracking
        run: |
          curl -s "https://api.github.com/repos/affaan-m/ECC" | jq -r '.pushed_at' > .opencode/last-port-sha
          git add .opencode/last-port-sha

      - name: Commit and push
        id: commit
        run: |
          git config user.name "everything-open-code[bot]"
          git config user.email "everything-open-code[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nothing to commit"
          else
            git commit -m "auto-port: sync from affaan-m/ECC"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Committed and pushed"
          fi